<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script type="module"
  src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>
body{
  margin:0;
  background:#000;
  overflow:hidden;
  font-family:system-ui;
}

model-viewer{
  width:100vw;
  height:100vh;
  background:#000;
}

.capture-btn{
  position:fixed;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  padding:16px 28px;
  border-radius:40px;
  border:none;
  background:#00c2ff;
  color:#000;
  font-weight:600;
  font-size:16px;
  z-index:10;
}
</style>
</head>

<body>

<model-viewer
  id="viewer"
  src="./caden20260211for_glb.glb"
  ios-src="./caden20260211for_glb.usdz"

  ar
  ar-modes="webxr scene-viewer quick-look"

  ar-scale="auto"
  ar-placement="floor"

  camera-controls
  interaction-prompt="auto"
  auto-rotate
>
</model-viewer>

<button class="capture-btn" onclick="capture()">
  📸 사진 저장
</button>

<script>
const viewer = document.getElementById("viewer");

async function checkAR() {
  if (navigator.xr) {
    try {
      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      if (!supported) {
        viewer.removeAttribute("ar");
      }
    } catch(e) {
      viewer.removeAttribute("ar");
    }
  } else {
    viewer.removeAttribute("ar");
  }
}

function capture(){
  const dataURL = viewer.toDataURL("image/png");
  const link = document.createElement("a");
  link.href = dataURL;
  link.download = "sofa-ar.png";
  link.click();
}

checkAR();
</script>

</body>
</html>
