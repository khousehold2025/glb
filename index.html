<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>K-Household 3D Showroom</title>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

<style>

html,body{
width:100%;
height:100%;
margin:0;
overflow:hidden;
background:#ffffff;
}

#renderCanvas{
width:100%;
height:100%;
touch-action:none;
}

</style>
</head>

<body>

<canvas id="renderCanvas"></canvas>

<script>

const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas,true);

const createScene = async function(){

const scene = new BABYLON.Scene(engine);

scene.clearColor = new BABYLON.Color4(1,1,1,1);



/* 카메라 */

const camera = new BABYLON.ArcRotateCamera(
"camera",
-Math.PI/2,
Math.PI/2.3,
6,
new BABYLON.Vector3(0,0.8,0),
scene
);

camera.attachControl(canvas,true);
camera.wheelDeltaPercentage = 0.01;



/* HDR 스튜디오 조명 */

const hdrTexture = BABYLON.CubeTexture.CreateFromPrefilteredData(
"https://playground.babylonjs.com/textures/environment.env",
scene
);

scene.environmentTexture = hdrTexture;



/* 메인 조명 */

const light = new BABYLON.DirectionalLight(
"dirLight",
new BABYLON.Vector3(-1,-2,-1),
scene
);

light.position = new BABYLON.Vector3(5,10,5);
light.intensity = 2;



/* 그림자 */

const shadowGenerator = new BABYLON.ShadowGenerator(2048,light);
shadowGenerator.useBlurExponentialShadowMap = true;
shadowGenerator.blurKernel = 32;



/* 바닥 */

const ground = BABYLON.MeshBuilder.CreateGround(
"ground",
{width:20,height:20},
scene
);

const groundMat = new BABYLON.StandardMaterial("groundMat",scene);
groundMat.diffuseColor = new BABYLON.Color3(0.95,0.95,0.95);

ground.material = groundMat;



/* 러그 */

const rug = BABYLON.MeshBuilder.CreateGround(
"rug",
{width:4,height:3},
scene
);

rug.position.y = 0.01;

const rugMat = new BABYLON.StandardMaterial("rugMat",scene);
rugMat.diffuseColor = new BABYLON.Color3(0.85,0.85,0.85);

rug.material = rugMat;



/* 쇼룸 배경 (Skybox 방식) */

const skybox = BABYLON.MeshBuilder.CreateBox(
"skyBox",
{size:1000},
scene
);

const skyboxMaterial = new BABYLON.StandardMaterial(
"skyBoxMat",
scene
);

skyboxMaterial.backFaceCulling = false;
skyboxMaterial.disableLighting = true;

skyboxMaterial.diffuseTexture = new BABYLON.Texture(
"./showroom.jpg",
scene
);

skyboxMaterial.diffuseTexture.uScale = -1;

skybox.material = skyboxMaterial;



/* GLB 제품 로드 */

const result = await BABYLON.SceneLoader.ImportMeshAsync(
"",
"./",
"caden20260211for_glb.glb",
scene
);



/* 그림자 적용 */

result.meshes.forEach(mesh=>{
shadowGenerator.addShadowCaster(mesh);
});



/* 자동 제품 프레이밍 */

const bounds = scene.getWorldExtends();

const size = bounds.max.subtract(bounds.min).length();

camera.radius = size * 1.8;

camera.target = bounds.max.add(bounds.min).scale(0.5);

camera.lowerRadiusLimit = size * 0.8;
camera.upperRadiusLimit = size * 4;



/* 자동 회전 */

scene.registerBeforeRender(function(){

result.meshes[0].rotation.y += 0.002;

});


return scene;

};


createScene().then(scene=>{
engine.runRenderLoop(()=>{
scene.render();
});
});


window.addEventListener("resize",()=>{
engine.resize();
});

</script>

</body>
</html>
