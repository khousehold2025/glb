<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script type="module"
  src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>
body { margin:0; }

model-viewer {
  width:100vw;
  height:100vh;
}

.capture-btn {
  position: fixed;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 26px;
  border-radius: 30px;
  border:none;
  font-size:16px;
  font-weight:600;
}
</style>
</head>

<body>

<model-viewer
  id="viewer"
  src="./caden20260211for_glb.glb"
  ar
  ar-modes="webxr"   <!-- 🔥 scene-viewer 제거 -->
  ar-scale="auto"
  ar-placement="floor"
  camera-controls>
</model-viewer>

<button class="capture-btn" onclick="captureAR()">
  📸 사진 찍기
</button>

<script>
function captureAR() {
  const viewer = document.getElementById("viewer");

  if (!viewer.arActive) {
    viewer.activateAR();   // AR 시작
  } else {
    viewer.toDataURL().then((dataUrl) => {
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = "sofa-ar.png";
      a.click();
    });
  }
}
</script>

</body>
</html>
