<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
    }

    .btn-wrap {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .btn {
      width: 220px;
      padding: 14px 26px;
      font-size: 16px;
      border-radius: 30px;
      border: none;
      font-weight: 600;
    }

    .ar-btn {
      background: #00c2ff;
      color: #000;
    }

    .guide {
      position: fixed;
      bottom: 32px;
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #ccc;
    }
  </style>
</head>

<body>

<model-viewer
  src="./caden20260211for_glb.glb"
  ios-src="./caden20260211for_usdz.usdz"
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  alt="Caden 테이블 AR"
>

  <div class="btn-wrap" slot="ar-button">
    <button class="btn ar-btn">
      📐 내 공간에 놓아보기
    </button>
  </div>

</model-viewer>

<div class="guide">
  AR 실행 후 화면의 📸 버튼으로 사진을 촬영할 수 있어요
</div>

</body>
</html>
