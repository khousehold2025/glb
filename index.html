<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    .btn-wrap {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .ar-btn {
      padding: 14px 26px;
      font-size: 16px;
      border-radius: 30px;
      border: none;
      background: #00c2ff;
      color: #000;
      font-weight: 600;
      width: 220px;
    }

    .guide {
      position: fixed;
      bottom: 32px;
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #ccc;
      line-height: 1.4;
    }
  </style>
</head>

<body>

<model-viewer
  src="./caden20260211for_glb.glb"
  ios-src="./caden20260211for_glb.usdz"

  ar
  ar-modes="webxr scene-viewer quick-look"

  ar-scale="auto"
  ar-placement="floor"

  camera-controls
  interaction-prompt="auto"
  interaction-prompt-style="wiggle"

  alt="Caden 테이블 AR"
>

  <div class="btn-wrap" slot="ar-button">
    <button class="ar-btn">
      📐 내 공간에 놓아보기
    </button>
  </div>

</model-viewer>

<div class="guide">
  📌 두 손가락으로 크기 조절 / 한 손으로 회전<br>
  📸 iPhone은 화면을 터치하면 사진 버튼이 나타나요
</div>

</body>
</html>
