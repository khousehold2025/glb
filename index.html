<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>3D Product Viewer</title>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script src="https://cdn.babylonjs.com/materialsLibrary/babylon.shadowOnlyMaterial.min.js"></script>

<style>

html,body{
width:100%;
height:100%;
margin:0;
overflow:hidden;
background:#ffffff;
}

#renderCanvas{
width:100%;
height:100%;
touch-action:none;
}

</style>
</head>

<body>

<canvas id="renderCanvas"></canvas>

<script>

const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas,true);

const createScene = async function(){

const scene = new BABYLON.Scene(engine);

scene.clearColor = new BABYLON.Color4(1,1,1,1);


/* 카메라 */

const camera = new BABYLON.ArcRotateCamera(
"camera",
-Math.PI/2,
Math.PI/2.4,
5,
new BABYLON.Vector3(0,0.8,0),
scene
);

camera.attachControl(canvas,true);
camera.wheelDeltaPercentage = 0.01;


/* HDR 스튜디오 조명 */

const hdrTexture = BABYLON.CubeTexture.CreateFromPrefilteredData(
"https://playground.babylonjs.com/textures/environment.env",
scene
);

scene.environmentTexture = hdrTexture;


/* 바닥 생성 */

const ground = BABYLON.MeshBuilder.CreateGround(
"ground",
{width:20,height:20},
scene
);

ground.position.y = 0;


/* 바닥 그림자 재질 */

const shadowMaterial = new BABYLON.ShadowOnlyMaterial(
"shadowMat",
scene
);

shadowMaterial.alpha = 0.35;
ground.material = shadowMaterial;


/* 조명 */

const light = new BABYLON.DirectionalLight(
"dirLight",
new BABYLON.Vector3(-1,-2,-1),
scene
);

light.position = new BABYLON.Vector3(5,10,5);
light.intensity = 2;


/* Soft Shadow */

const shadowGenerator = new BABYLON.ShadowGenerator(2048,light);

shadowGenerator.useBlurExponentialShadowMap = true;
shadowGenerator.blurKernel = 32;


/* GLB 로드 */

const result = await BABYLON.SceneLoader.ImportMeshAsync(
"",
"./",
"caden20260211for_glb.glb",
scene
);


/* 그림자 적용 */

result.meshes.forEach(function(mesh){

shadowGenerator.addShadowCaster(mesh);

});


/* 자동 제품 프레이밍 */

const boundingInfo = scene.getWorldExtends();

const size = boundingInfo.max.subtract(boundingInfo.min).length();

camera.radius = size * 1.5;

camera.target = boundingInfo.max.add(boundingInfo.min).scale(0.5);

camera.lowerRadiusLimit = size * 0.8;
camera.upperRadiusLimit = size * 4;


/* 자동 회전 (선택) */

scene.registerBeforeRender(function(){

result.meshes[0].rotation.y += 0.002;

});


return scene;

};


createScene().then(scene=>{

engine.runRenderLoop(function(){

scene.render();

});

});


window.addEventListener("resize",function(){

engine.resize();

});

</script>

</body>
</html>
