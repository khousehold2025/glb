<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script type="module"
  src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>
body {
  margin:0;
  background:#000;
  overflow:hidden;
  font-family:sans-serif;
}

model-viewer {
  width:100vw;
  height:100vh;
}

.main-btn {
  position: fixed;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  padding:14px 26px;
  border-radius:30px;
  border:none;
  font-size:16px;
  font-weight:600;
  background:#00c2ff;
  color:#000;
  z-index:10;
}

.notice {
  position: fixed;
  bottom:40px;
  width:100%;
  text-align:center;
  font-size:13px;
  color:#ccc;
}
</style>
</head>

<body>

<model-viewer
  id="viewer"
  src="./caden20260211for_glb.glb"
  ar
  ar-modes="webxr"
  ar-scale="auto"
  ar-placement="floor"
  camera-controls
>
</model-viewer>

<button class="main-btn" onclick="handleAR()">
  📐 AR 시작
</button>

<div class="notice">
  Android Chrome 전용 | 두 손가락으로 크기 조절
</div>

<script>
const viewer = document.getElementById("viewer");
const btn = document.querySelector(".main-btn");

function handleAR() {

  // 아직 AR 시작 안했으면 → 시작
  if (!viewer.arActive) {
    viewer.activateAR();
    btn.innerText = "📸 사진 찍기";
  }

  // AR 상태면 → 캡처
  else {
    viewer.toDataURL().then((dataUrl) => {
      const link = document.createElement("a");
      link.href = dataUrl;
      link.download = "sofa-ar.png";
      link.click();
    });
  }
}
</script>

</body>
</html>
