<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: #000;
    }
  </style>
</head>

<body>

<model-viewer
  src="./caden20260211for_glb.glb"
  ios-src="./caden20260211for_usdz.usdz"
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  touch-action="pan-y"
  shadow-intensity="1"
  alt="Caden 테이블 AR"
>

  <button slot="ar-button"
    style="
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 26px;
      font-size: 16px;
      border-radius: 30px;
      border: none;
      background: #00c2ff;
      color: #000;
      font-weight: 600;
    ">
    📐 내 공간에 놓아보기
  </button>

</model-viewer>

</body>
</html>
