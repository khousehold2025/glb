<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script type="module"
  src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#000;
  font-family:system-ui;
}

model-viewer{
  width:100vw;
  height:100vh;
  background:#000;
}

/* AR 실행 버튼 */
.ar-btn{
  position:fixed;
  bottom:110px;
  left:50%;
  transform:translateX(-50%);
  padding:16px 28px;
  border-radius:40px;
  border:none;
  background:#00c2ff;
  color:#000;
  font-weight:600;
  font-size:16px;
  z-index:10;
}

/* 사진 버튼 */
.capture-btn{
  position:fixed;
  bottom:50px;
  left:50%;
  transform:translateX(-50%);
  padding:14px 26px;
  border-radius:40px;
  border:none;
  background:#ffffff;
  color:#000;
  font-weight:600;
  font-size:15px;
  z-index:10;
}
</style>
</head>

<body>

<model-viewer
  id="viewer"
  src="./caden20260211for_glb.glb"

  ar
  ar-modes="webxr"   <!-- 🔥 Scene Viewer 제거 -->

  ar-scale="auto"
  ar-placement="floor"

  camera-controls
  interaction-prompt="auto"
  shadow-intensity="1"
  alt="Caden 소파 AR">
</model-viewer>

<!-- AR 실행 버튼 -->
<button class="ar-btn" onclick="activateAR()">
📐 내 공간에 놓아보기
</button>

<!-- 사진 버튼 -->
<button class="capture-btn" onclick="captureImage()">
📸 사진 찍기
</button>

<script>
const viewer = document.getElementById("viewer");

function activateAR(){
  viewer.activateAR();
}

/* 📸 AR 상태에서 화면 캡처 */
function captureImage(){
  try{
    const dataURL = viewer.toDataURL("image/png");
    const link = document.createElement("a");
    link.href = dataURL;
    link.download = "sofa-ar.png";
    link.click();
  }catch(e){
    alert("AR 실행 후 촬영해주세요.");
  }
}
</script>

</body>
</html>
